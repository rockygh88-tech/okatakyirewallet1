<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKATAKYIRE WALLET</title>
<meta name="description" content="OKATAKYIRE WALLET - your personal offline money tracker. Track, Save, Plan, Achieve.">
<meta name="theme-color" content="#0a3d1f">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OK Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  /* Apply the saved theme before first paint (avoids a white flash in dark mode).
     The real setting lives in IndexedDB; this is only a fast cache of it. */
  (function () {
    try {
      var t = localStorage.getItem('okw-theme') || 'light';
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Splash screen -->
<div id="splash" aria-hidden="true">
  <img src="icons/logo-256.png" alt="" width="150" height="150">
  <p class="splash-name">OKATAKYIRE WALLET</p>
  <p class="splash-tag">Track • Save • Plan • Achieve</p>
  <div class="spinner"></div>
</div>

<div id="app">
  <header class="topbar">
    <img src="icons/logo-256.png" alt="OKATAKYIRE WALLET logo" width="44" height="44">
    <div class="brand"><b>OKATAKYIRE WALLET</b><small>Track • Save • Plan • Achieve</small></div>
    <button class="icon-btn light" data-go="settings" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    </button>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Main navigation">
    <button class="nav-item on" data-go="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg><span>Home</span>
    </button>
    <button class="nav-item" data-go="history">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>History</span>
    </button>
    <button class="nav-item nav-add" data-act="add" aria-label="Add savings, expense or goal">
      <span class="fab"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Add</span>
    </button>
    <button class="nav-item" data-go="goals">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Goals</span>
    </button>
    <button class="nav-item" data-go="more">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>More</span>
    </button>
  </nav>
</div>

<div id="overlays"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<input type="file" id="restoreInput" accept=".json,application/json" hidden>

<noscript><p style="padding:24px;font-family:sans-serif">OKATAKYIRE WALLET needs JavaScript to run.</p></noscript>

<script src="vendor/chart.umd.js"></script>
<script src="utils.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
</body>
</html>
